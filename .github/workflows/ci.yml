name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # M0 needs a Mac (mygo doctor, the macOS app bundle).
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/verify.sh M0

  # M1 and later need Docker, which GitHub's macOS runners lack.
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/verify.sh M1
      # M2's VM test needs lima on a Mac; CI only checks that it compiles.
      - run: go vet -tags vm ./...
