name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # M0 needs a Mac (mygo doctor, the macOS app).
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: scripts/verify.sh M0

  # M1 and later need Docker, which GitHub's macOS runners lack.
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/verify.sh M1
